[tool.poetry]
name = "tsp-rl-metaheuristic"
version = "0.1.0"
description = "A package for solving the Traveling Salesman Problem using RL and metaheuristics."
authors = ["karinassini <karinassini@gmail.com>"]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
setuptools = "*"
wheel = "*"
numpy = "*"
networkx = "^2.8.0"
matplotlib="*"
black = "*"
gurobipy = "*"

[tool.poetry.dev-dependencies]
pytest = "^7.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
